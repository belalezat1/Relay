version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: relay_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay_dev}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: relay-api:local
    container_name: relay_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-relay_dev}
      DB_USERNAME: ${POSTGRES_USER:-relay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev}
      APP_PORT: ${APP_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_POLL_DELAY: ${WORKER_POLL_DELAY:-5000}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-relay.workflow.events}
    ports:
      - "${APP_PORT:-8080}:8080"
    profiles: ["app"]

  kafka:
    image: bitnami/kafka:3.7
    container_name: relay_kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    profiles: ["kafka"]

volumes:
  postgres_data:
