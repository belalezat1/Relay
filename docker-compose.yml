services:
  postgres:
    image: postgres:15-alpine
    container_name: relay_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay_dev}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    container_name: relay_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    profiles: ["kafka", "distributed"]

  relay-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: relay-api:local
    container_name: relay_api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-relay_dev}
      DB_USERNAME: ${POSTGRES_USER:-relay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev}
      APP_PORT: ${APP_PORT:-8080}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_POLL_DELAY: ${WORKER_POLL_DELAY:-5000}
      WORKER_ORCHESTRATION_ENABLED: ${WORKER_ORCHESTRATION_ENABLED:-true}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-relay.workflow.events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-relay-workflow-events}
      KAFKA_TASK_TOPIC: ${KAFKA_TASK_TOPIC:-relay.workflow.tasks}
      KAFKA_TASK_CONSUMER_GROUP: ${KAFKA_TASK_CONSUMER_GROUP:-relay-workflow-task-group}
      KAFKA_TASK_RETRY_TOPIC: ${KAFKA_TASK_RETRY_TOPIC:-relay.workflow.tasks.retry}
      KAFKA_TASK_RETRY_CONSUMER_GROUP: ${KAFKA_TASK_RETRY_CONSUMER_GROUP:-relay-workflow-task-retry-group}
      RETRY_BACKOFF_ENABLED: ${RETRY_BACKOFF_ENABLED:-true}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      TASK_CLAIM_LEASE_SECONDS: ${TASK_CLAIM_LEASE_SECONDS:-300}
      OUTBOX_POLL_DELAY: ${OUTBOX_POLL_DELAY:-1000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    ports:
      - "${APP_PORT:-8080}:8080"
    profiles: ["app", "distributed"]

  relay-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: relay-api:local
    container_name: relay_worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      relay-api:
        condition: service_started
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-relay_dev}
      DB_USERNAME: ${POSTGRES_USER:-relay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-relay_dev}
      APP_PORT: 8081
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-4}
      WORKER_POLL_DELAY: ${WORKER_POLL_DELAY:-5000}
      WORKER_ORCHESTRATION_ENABLED: "false"
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-relay.workflow.events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-relay-workflow-events}
      KAFKA_TASK_TOPIC: ${KAFKA_TASK_TOPIC:-relay.workflow.tasks}
      KAFKA_TASK_CONSUMER_GROUP: ${KAFKA_TASK_CONSUMER_GROUP:-relay-workflow-task-group}
      KAFKA_TASK_RETRY_TOPIC: ${KAFKA_TASK_RETRY_TOPIC:-relay.workflow.tasks.retry}
      KAFKA_TASK_RETRY_CONSUMER_GROUP: ${KAFKA_TASK_RETRY_CONSUMER_GROUP:-relay-workflow-task-retry-group}
      RETRY_BACKOFF_ENABLED: ${RETRY_BACKOFF_ENABLED:-true}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      TASK_CLAIM_LEASE_SECONDS: ${TASK_CLAIM_LEASE_SECONDS:-300}
      OUTBOX_POLL_DELAY: ${OUTBOX_POLL_DELAY:-1000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    profiles: ["distributed"]

volumes:
  postgres_data:
