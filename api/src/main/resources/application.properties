spring.application.name=relay
spring.profiles.active=${APP_ENV:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database configuration for local and containerized deployments
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:relay_dev}
spring.datasource.username=${DB_USERNAME:relay}
spring.datasource.password=${DB_PASSWORD:relay_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${APP_PORT:8080}
server.servlet.context-path=/api

# Worker runtime
relay.worker.max-concurrency=${WORKER_MAX_CONCURRENCY:4}
relay.worker.poll-delay=${WORKER_POLL_DELAY:5000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.relay=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
