spring.application.name=relay
spring.profiles.active=${APP_ENV:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database configuration for local and containerized deployments
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:relay_dev}
spring.datasource.username=${DB_USERNAME:relay}
spring.datasource.password=${DB_PASSWORD:relay_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${APP_PORT:8080}
server.servlet.context-path=/api

# Worker runtime
relay.worker.max-concurrency=${WORKER_MAX_CONCURRENCY:4}
relay.worker.poll-delay=${WORKER_POLL_DELAY:5000}
relay.worker.id=${WORKER_ID:}
relay.worker.orchestration-enabled=${WORKER_ORCHESTRATION_ENABLED:true}
relay.task.claim-lease-seconds=${TASK_CLAIM_LEASE_SECONDS:300}
relay.task.lease-recovery-delay=${TASK_LEASE_RECOVERY_DELAY:15000}
relay.task.claim.skip-locked=${TASK_CLAIM_SKIP_LOCKED:true}

# Retry / backoff (exponential + jitter)
relay.retry.backoff-enabled=${RETRY_BACKOFF_ENABLED:true}
relay.retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
relay.retry.initial-backoff-seconds=${RETRY_INITIAL_BACKOFF_SECONDS:5}
relay.retry.backoff-multiplier=${RETRY_BACKOFF_MULTIPLIER:2}
relay.retry.jitter-fraction=${RETRY_JITTER_FRACTION:0.2}
relay.kafka.retry-backoff-enabled=${KAFKA_RETRY_BACKOFF_ENABLED:${relay.retry.backoff-enabled}}

# Transactional outbox
relay.outbox.poll-delay=${OUTBOX_POLL_DELAY:1000}
relay.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
relay.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:8}
relay.outbox.initial-backoff-seconds=${OUTBOX_INITIAL_BACKOFF_SECONDS:2}
relay.outbox.backoff-multiplier=${OUTBOX_BACKOFF_MULTIPLIER:2}
relay.outbox.jitter-fraction=${OUTBOX_JITTER_FRACTION:0.2}

# Kafka transport (required in runtime; set KAFKA_ENABLED=false only for sliced unit tests)
relay.kafka.enabled=${KAFKA_ENABLED:true}
relay.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
relay.kafka.topic=${KAFKA_TOPIC:relay.workflow.events}
relay.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:relay-workflow-events}
relay.kafka.task-topic=${KAFKA_TASK_TOPIC:relay.workflow.tasks}
relay.kafka.task-consumer.group-id=${KAFKA_TASK_CONSUMER_GROUP:relay-workflow-task-group}
relay.kafka.task-retry-topic=${KAFKA_TASK_RETRY_TOPIC:relay.workflow.tasks.retry}
relay.kafka.task-retry-consumer.group-id=${KAFKA_TASK_RETRY_CONSUMER_GROUP:relay-workflow-task-retry-group}
relay.kafka.lag-poll-delay=${KAFKA_LAG_POLL_DELAY:15000}
spring.kafka.bootstrap-servers=${relay.kafka.bootstrap-servers}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.kafka.enabled=${KAFKA_ENABLED:true}

# Logging
logging.level.root=INFO
logging.level.com.relay=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
