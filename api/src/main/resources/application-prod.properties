logging.level.root=WARN
logging.level.com.relay=INFO

relay.worker.orchestration-enabled=${WORKER_ORCHESTRATION_ENABLED:true}

relay.kafka.enabled=${KAFKA_ENABLED:true}
relay.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
relay.kafka.topic=${KAFKA_TOPIC:relay.workflow.events}
relay.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:relay-workflow-events}
relay.kafka.task-topic=${KAFKA_TASK_TOPIC:relay.workflow.tasks}
relay.kafka.task-consumer.group-id=${KAFKA_TASK_CONSUMER_GROUP:relay-workflow-task-group}
relay.kafka.task-retry-topic=${KAFKA_TASK_RETRY_TOPIC:relay.workflow.tasks.retry}
relay.kafka.task-retry-consumer.group-id=${KAFKA_TASK_RETRY_CONSUMER_GROUP:relay-workflow-task-retry-group}
relay.kafka.retry-backoff-enabled=${KAFKA_RETRY_BACKOFF_ENABLED:true}
relay.kafka.lag-poll-delay=${KAFKA_LAG_POLL_DELAY:15000}
relay.task.claim-lease-seconds=${TASK_CLAIM_LEASE_SECONDS:300}
relay.task.lease-recovery-delay=${TASK_LEASE_RECOVERY_DELAY:15000}
relay.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:8}
relay.outbox.initial-backoff-seconds=${OUTBOX_INITIAL_BACKOFF_SECONDS:2}

spring.kafka.bootstrap-servers=${relay.kafka.bootstrap-servers}
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

management.endpoint.health.show-details=when_authorized
management.health.kafka.enabled=${KAFKA_ENABLED:true}
